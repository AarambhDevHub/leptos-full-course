[package]
name = "module-24-islands"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "module-24-islands"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
# Shared Leptos view and reactive primitives.
leptos = { workspace = true }
# Metadata manager for titles, meta tags, and SSR head injection.
leptos_meta = { workspace = true }
# Router components and hooks for server-rendered routes.
leptos_router = { workspace = true }
# Axum integration for SSR routes, files, and server functions.
leptos_axum = { workspace = true, optional = true }
# Axum HTTP server used by this full-stack module.
axum = { workspace = true, optional = true }
# Tokio runtime for async server execution.
tokio = { workspace = true, optional = true }
# Tower HTTP middleware for production server layers.
tower-http = { workspace = true, optional = true }
# Browser panic hook used by the hydration entry point.
console_error_panic_hook = { workspace = true, optional = true }
# wasm-bindgen exports the hydration function to JavaScript.
wasm-bindgen = { workspace = true, optional = true }
# Small hydrated islands use localStorage, root styling, and deferred timers.
web-sys = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }
# Serialization for server function arguments and return values.
serde = { workspace = true }
serde_json = { workspace = true }
# Error types for domain-specific failures.
thiserror = { workspace = true }
anyhow = { workspace = true }
# Logging and tracing for SSR modules.
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# Utilities used by full-stack examples.
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }

[features]
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:gloo-timers",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[package.metadata.leptos]
output-name = "module-24-islands"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
